name: Build & Publish Client Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OCTANE_SINGLE_BUNDLE: '1'
  OCTANE_JSON_MODE: 'legacy'

jobs:
  # The companion renderer is our public Heaven fork. No private upstream token
  # is required, so a source change can produce a deployable client artifact.
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v7
        with:
          path: octane

      - name: Checkout renderer
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/Octane-Renderer
          ref: main
          path: octane-renderer

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'octane/.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install renderer dependencies
        working-directory: octane-renderer
        run: corepack yarn install --immutable

      - name: Install client dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        working-directory: octane
        run: corepack yarn install --immutable

      - name: Link renderer into client
        run: |
          mkdir -p octane/node_modules/@octane
          ln -sfn "${{ github.workspace }}/octane-renderer" octane/node_modules/@octane/renderer

      - name: Verify UI and Renderer type compatibility
        working-directory: octane
        run: yarn typecheck

      - name: Build client
        working-directory: octane
        run: yarn build

      - name: Read package version
        id: version
        working-directory: octane
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Package dist
        working-directory: octane
        run: |
          zip -r "../heaven-client-dist-${{ steps.version.outputs.short_sha }}.zip" dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: client-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          name: Heaven Client ${{ steps.version.outputs.version }} (${{ steps.version.outputs.short_sha }})
          generate_release_notes: true
          files: heaven-client-dist-${{ steps.version.outputs.short_sha }}.zip
